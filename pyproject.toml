[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "qildo-beats"
version = "0.1.0"
description = "Offline beat and downbeat tracking for Qildo"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy==2.2.6", "scipy==1.15.3"]

[project.optional-dependencies]
eval = ["mir-eval==0.8.2"]
ml = ["torch==2.8.0"]
data = ["mido==1.3.3"]
dev = ["pytest==8.4.2", "ruff==0.13.2"]

[tool.setuptools.packages.find]
include = ["qildo_beats*"]

[tool.ruff]
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
